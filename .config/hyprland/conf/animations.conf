animations {
    enabled = true

    # Bezier curves
    bezier = easeOutQuint,  0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.35, 0.95
    bezier = linear,        0, 0, 1, 1
    bezier = almostLinear,  0.5, 0.5, 0.75, 1.0
    bezier = quick,         0.15, 0, 0.1, 1

    # Windows
    animation = windowsIn,   1, 6,  easeOutQuint,   popin 80%
    animation = windowsOut,  1, 6,  easeOutQuint,   popin 80%
    animation = windowsMove, 1, 5,  easeInOutCubic

    # Fading
    animation = fadeIn,      1, 10, almostLinear
    animation = fadeOut,     1, 10, almostLinear
    animation = fadeSwitch,  0, 1,  linear
    animation = fadeShadow,  1, 10, linear
    animation = fadeDim,     1, 10, almostLinear
    animation = fadeLayersIn, 1, 3, quick
    animation = fadeLayersOut, 1, 1.5, linear

    # Workspaces
    animation = workspaces,     1, 4, easeOutQuint,   slide
    animation = workspacesIn,   1, 4, easeOutQuint,   slide
    animation = workspacesOut,  1, 4, easeOutQuint,   slide
}