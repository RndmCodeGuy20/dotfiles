general {
    gaps_in         = 6
    gaps_out        = 12
    border_size     = 2

    col.active_border   = $mauve $blue 45deg
    col.inactive_border = $surface1

    resize_on_border    = true
    layout              = dwindle
}

decoration {
    rounding            = 12
    rounding_power      = 2

    active_opacity      = 1.0
    inactive_opacity    = 0.92

    shadow {
        enabled         = true
        range           = 20
        render_power    = 3
        color           = rgba(1e1e2e88)
    }

    blur {
        enabled         = true
        size            = 6
        passes          = 3
        new_optimizations = true
        xray            = false
        noise           = 0.02
        contrast        = 1.0
        brightness      = 1.0
        vibrancy        = 0.2
    }
}

dwindle {
    pseudotile          = true
    preserve_split      = true
}