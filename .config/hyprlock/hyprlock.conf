background {
    monitor =
    color = rgba(30, 30, 46, 1.0)
    blur_passes = 3
    blur_size = 7
    brightness = 0.8
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgb(203, 166, 247)
    inner_color = rgb(49, 50, 68)
    font_color = rgb(205, 214, 244)
    fade_on_empty = true
    placeholder_text = <i>󰌾  Enter Password</i>
    hide_input = false
    check_color = rgb(166, 227, 161)
    fail_color = rgb(243, 139, 168)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    position = 0, -120
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(205, 214, 244, 1.0)
    font_size = 72
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 200
    halign = center
    valign = center
}

label {
    monitor =
    text = $DATE
    color = rgba(203, 166, 247, 1.0)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text =   $USER
    color = rgba(137, 180, 250, 1.0)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, -60
    halign = center
    valign = center
}